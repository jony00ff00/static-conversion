name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Pinned to the same Playwright version as package.json so the browser and
    # system fonts are identical on every run (golden screenshots depend on this).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - name: Install PDF tools (pdfinfo, pdffonts, pdftotext, pdftoppm)
        run: apt-get update && apt-get install -y --no-install-recommends poppler-utils
      - uses: actions/checkout@v4
      - name: Fonts (Inter as the default sans-serif, as in development)
        run: sh scripts/ci-fonts.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Upload golden diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diff
          path: .golden-diff/
          include-hidden-files: true
