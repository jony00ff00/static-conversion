name: Regenerate golden files

# Renders every fixture on the same Playwright image as CI and pushes the new
# golden files (plus any isolation-test diff images) to the golden-results
# branch, for review before they are committed to main. Run it from the
# Actions tab, or push to the golden-update branch.

on:
  workflow_dispatch:
  push:
    branches: [golden-update]

permissions:
  contents: write

jobs:
  golden:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Fonts (Inter as the default sans-serif, as in development)
        run: sh scripts/ci-fonts.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run golden:update
      - name: Isolation test (diff images on failure)
        continue-on-error: true
        run: npx vitest run tests/m3-decomposition.test.ts
      - name: Push results to the golden-results branch
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git checkout -q -B golden-results
          git add -A golden
          if [ -d .golden-diff ]; then git add -f .golden-diff; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q --allow-empty -m "Golden files rendered on the CI image (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" golden-results
