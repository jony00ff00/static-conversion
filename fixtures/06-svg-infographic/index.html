<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>SVG infographic fixture</title>
<style>body{margin:0;padding:32px;font-family:Verdana,sans-serif;background:#f0fdfa;color:#134e4a}h1{margin-top:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.stat{background:#fff;border-radius:12px;padding:16px;text-align:center}</style></head>
<body>
<h1>Water use in 2025</h1>
<div class="grid">
  <div class="stat"><svg width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="62 percent"><circle cx="100" cy="100" r="80" fill="none" stroke="#ccfbf1" stroke-width="24"/><circle cx="100" cy="100" r="80" fill="none" stroke="#0d9488" stroke-width="24" stroke-dasharray="311.6 502.7" transform="rotate(-90 100 100)"/><text x="100" y="112" text-anchor="middle" font-size="36" fill="#134e4a">62%</text></svg><p>Agriculture</p></div>
  <div class="stat"><svg width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="23 percent"><circle cx="100" cy="100" r="80" fill="none" stroke="#ccfbf1" stroke-width="24"/><circle cx="100" cy="100" r="80" fill="none" stroke="#0891b2" stroke-width="24" stroke-dasharray="115.6 502.7" transform="rotate(-90 100 100)"/><text x="100" y="112" text-anchor="middle" font-size="36" fill="#134e4a">23%</text></svg><p>Industry</p></div>
  <div class="stat"><svg width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="15 percent"><circle cx="100" cy="100" r="80" fill="none" stroke="#ccfbf1" stroke-width="24"/><circle cx="100" cy="100" r="80" fill="none" stroke="#0284c7" stroke-width="24" stroke-dasharray="75.4 502.7" transform="rotate(-90 100 100)"/><text x="100" y="112" text-anchor="middle" font-size="36" fill="#134e4a">15%</text></svg><p>Households</p></div>
</div>
<svg width="100%" height="160" viewBox="0 0 900 160" preserveAspectRatio="none" style="margin-top:24px;background:#fff;border-radius:12px">
  <polyline fill="none" stroke="#0d9488" stroke-width="4" points="0,120 150,100 300,110 450,70 600,80 750,40 900,50"/>
  <g font-size="14" fill="#134e4a"><text x="10" y="150">2019</text><text x="840" y="150">2025</text></g>
</svg>
</body>
</html>
