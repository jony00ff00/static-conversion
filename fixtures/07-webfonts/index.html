<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Web fonts fixture</title>
<style>
/* Self-hosted copy of a Google-Fonts-style family (Inter, from @fontsource). */
@font-face{font-family:'InterLocal';font-style:normal;font-weight:400;font-display:block;src:url(fonts/inter-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'InterLocal';font-style:normal;font-weight:700;font-display:block;src:url(fonts/inter-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'InterLocal';font-style:italic;font-weight:400;font-display:block;src:url(fonts/inter-latin-400-italic.woff2) format('woff2')}
body{margin:0;padding:48px;font-family:'InterLocal',sans-serif;background:#fff;color:#111}
h1{font-weight:700;font-size:48px;margin:0 0 8px}
.lede{font-style:italic;font-size:20px;color:#444}
.specimen{font-size:28px;letter-spacing:.02em}
.fallback{font-family:'DefinitelyMissingFont',serif}
</style></head>
<body>
<h1>Inter, self-hosted</h1>
<p class="lede">An italic lede set in the same family.</p>
<p class="specimen">ABCDEFGHIJKLMNOPQRSTUVWXYZ<br>abcdefghijklmnopqrstuvwxyz<br>0123456789 £€$ &amp; ?! “quotes”</p>
<p class="fallback">This paragraph asks for a font that does not exist, so a fallback is used.</p>
</body>
</html>
