<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Print media and dark mode fixture</title>
<style>
:root{--bg:#ffffff;--fg:#0f172a;--accent:#9333ea}
html.dark{--bg:#0f172a;--fg:#e2e8f0;--accent:#c084fc}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,sans-serif}
.site-nav{position:sticky;top:0;background:var(--accent);color:#fff;padding:12px 24px;display:flex;justify-content:space-between}
main{padding:32px 24px}
.cookie{position:fixed;bottom:0;left:0;right:0;background:#1e293b;color:#fff;padding:16px 24px;display:flex;justify-content:space-between}
.only-print{display:none}
@media print{.site-nav,.cookie,.no-print{display:none}.only-print{display:block}a::after{content:" (" attr(href) ")"}}
</style></head>
<body>
<nav class="site-nav"><span>Event Co.</span><button class="no-print" id="theme">Toggle dark mode</button></nav>
<main>
  <h1>Summer Conference 2026</h1>
  <p>Join us on 14 July at the Riverside Hall. Book at <a href="https://example.com/book">our booking page</a>.</p>
  <p class="no-print">Scroll down for the live schedule.</p>
  <p class="only-print">Printed programme — please keep for reference.</p>
  <table><tr><th>Time</th><th>Session</th></tr><tr><td>09:00</td><td>Welcome</td></tr><tr><td>10:00</td><td>Keynote</td></tr></table>
</main>
<div class="cookie" role="dialog" aria-label="Cookie consent"><span>We use cookies.</span><button>Accept</button></div>
<script>document.getElementById('theme').addEventListener('click',function(){document.documentElement.classList.toggle('dark')});</script>
</body>
</html>
