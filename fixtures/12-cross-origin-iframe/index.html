<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Cross-origin iframe fixture</title>
<style>body{margin:0;padding:32px;font-family:Arial,sans-serif}.map{width:600px;height:300px;border:2px solid #94a3b8;background:#f1f5f9}</style></head>
<body>
<h1>Find us</h1>
<p>The map below is embedded from another site. The sandbox blocks it, and from M1 on it is replaced by a screenshot of that region.</p>
<iframe class="map" src="https://maps.example.com/embed?q=riverside" title="Map"></iframe>
<p>Riverside Hall, 1 Quay Road.</p>
<img src="https://cdn.example.com/logo.png" alt="External logo (blocked)" width="120" height="40">
</body>
</html>
